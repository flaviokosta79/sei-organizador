services:
  organizador:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SEI_UNIT_ID: ${SEI_UNIT_ID:?Configure a unidade autorizada}
      SEI_ALLOW_PUBLIC_ACCESS: "true"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - organizador:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  organizador:
